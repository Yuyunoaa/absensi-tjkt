<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi SMKN 2 Baleendah TJKT</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
        }
        .fade-in { 
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.3); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- App Root Container -->
    <div id="root" class="min-h-screen flex flex-col w-full"></div>

    <!-- Custom Modal for Alerts -->

        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl p-8 max-w-sm w-full mx-4 transform scale-95 opacity-0 transition-all duration-300 border border-slate-100 dark:border-slate-800" id="modal-content">
            <div class="text-center">
                <i class="fas fa-check-circle text-6xl text-emerald-500 mb-4 drop-shadow-md" id="modal-icon"></i>

                <p class="text-sm text-slate-500 dark:text-slate-400 mb-8 leading-relaxed" id="modal-message">Pesan disini.</p>
                <button id="btn-close-modal" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl hover:bg-blue-700 transition-all w-full font-semibold shadow-lg shadow-blue-600/30 active:scale-95">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Custom Modal for API Key Settings -->
    <div id="apikey-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center hidden z-50 transition-opacity p-4">
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl p-6 sm:p-8 max-w-md w-full border border-slate-100 dark:border-slate-800">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-900 dark:text-white"><i class="fas fa-key text-purple-600 mr-2"></i> Pengaturan Gemini API Key</h3>
                <button id="btn-close-apikey" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fas fa-times"></i></button>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400 mb-4 leading-relaxed">Masukkan Gemini API Key Anda agar fitur AI Assistant & Tanya Soal dapat digunakan secara publik di GitHub Pages.</p>
            <div class="space-y-4">
                <input type="password" id="input-custom-apikey" placeholder="Tempel API Key di sini..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                <button type="button" id="btn-save-apikey" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-xl shadow-md transition-all text-sm">Simpan API Key</button>
            </div>
        </div>
    </div>

    <!-- Custom Modal for Editing Data by Admin -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center hidden z-50 transition-opacity p-4">
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl p-6 sm:p-8 max-w-lg w-full transform scale-95 opacity-0 transition-all duration-300 border border-slate-100 dark:border-slate-800" id="edit-modal-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-slate-900 dark:text-white"><i class="fas fa-user-edit text-blue-600 mr-2"></i> Edit Data Absensi Siswa</h3>
                <button id="btn-close-edit" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xl"><i class="fas fa-times"></i></button>
            </div>
            <form id="edit-form" class="space-y-4">
                <input type="hidden" id="edit-record-id">
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Nama Lengkap</label>
                    <input type="text" id="edit-name" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none font-medium" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">NIS</label>
                        <input type="text" id="edit-nis" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none font-medium" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Kelas</label>
                        <select id="edit-class" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none font-medium">
                            <!-- Options injected -->
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Tanggal</label>
                        <input type="date" id="edit-date" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none font-medium" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Status Kehadiran</label>
                        <select id="edit-status" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none font-medium">
                            <option value="Hadir">Hadir</option>
                            <option value="Izin">Izin</option>
                            <option value="Sakit">Sakit</option>
                            <option value="Alpa">Alpa</option>
                        </select>
                    </div>
                </div>
                <div class="pt-4 flex gap-3">
                    <button type="button" id="btn-cancel-edit" class="flex-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold py-2.5 rounded-xl transition-all">Batal</button>
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl shadow-lg shadow-blue-600/30 transition-all">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const classes = [
            'X TJKT 1', 'X TJKT 2', 'X TJKT 3',
            'XI TJKT 1', 'XI TJKT 2', 'XI TJKT 3',
            'XII TJKT 1', 'XII TJKT 2', 'XII TJKT 3', 'XII TJKT 4'
        ];

        const STORAGE_KEY = 'smkn2tjkt_absensi_records_v10';
        const CHAT_STORAGE_KEY = 'smkn2tjkt_chat_history_v10';
        const NOTES_STORAGE_KEY = 'smkn2tjkt_notes_v4';
        const SCHEDULE_STORAGE_KEY = 'smkn2tjkt_schedule_v2';
        const THEME_STORAGE_KEY = 'smkn2tjkt_theme';
        const CUSTOM_API_KEY_STORAGE = 'smkn2tjkt_custom_apikey';
        
        let initialRecords = [
            { id: 'REC_1', name: 'Ahmad Fauzi', nis: '10231', kelas: 'X TJKT 1', gender: 'Laki-laki', tanggal: new Date().toISOString().split('T')[0], waktu: '07:15:20', status: 'Hadir' },
            { id: 'REC_2', name: 'Siti Rahma', nis: '10232', kelas: 'X TJKT 1', gender: 'Perempuan', tanggal: new Date().toISOString().split('T')[0], waktu: '07:20:10', status: 'Hadir' },
            { id: 'REC_3', name: 'Budi Santoso', nis: '10541', kelas: 'XI TJKT 2', gender: 'Laki-laki', tanggal: new Date().toISOString().split('T')[0], waktu: '07:10:05', status: 'Izin' }
        ];

        let savedRecords = localStorage.getItem(STORAGE_KEY);
        let recordsList = savedRecords ? JSON.parse(savedRecords) : initialRecords;

        let defaultChat = [
            { role: 'assistant', text: 'Halo! Saya Asisten AI SMKN 2 Baleendah jurusan TJKT. Saya siap membantu menjawab pertanyaan pelajaran atau membantu menyelesaikan soal Matematika dan TJKT. Riwayat obrolan Anda tersimpan otomatis.' }
        ];
        let savedChat = localStorage.getItem(CHAT_STORAGE_KEY);
        let chatRecordsList = savedChat ? JSON.parse(savedChat) : defaultChat;

        let savedNotes = localStorage.getItem(NOTES_STORAGE_KEY);
        let notesList = savedNotes ? JSON.parse(savedNotes) : [
            { id: 'NOTE_1', date: new Date().toLocaleDateString('id-ID'), text: 'Jam pertama dimulai pukul 07.00 WIB. Siswa TJKT wajib menggunakan pakaian seragam lengkap.' }
        ];

        let savedSchedule = localStorage.getItem(SCHEDULE_STORAGE_KEY);
        let scheduleList = savedSchedule ? JSON.parse(savedSchedule) : [
            { id: 'SCH_1', kelas: 'X TJKT 1', hari: 'Senin', jam: '07.00 - 09.30', mapel: 'Matematika' },
            { id: 'SCH_2', kelas: 'X TJKT 1', hari: 'Senin', jam: '09.45 - 12.15', mapel: 'Administrasi Infrastruktur Jaringan' },
            { id: 'SCH_3', kelas: 'XI TJKT 2', hari: 'Senin', jam: '07.00 - 11.15', mapel: 'Teknologi Layanan Jaringan' }
        ];

        let savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        let appState = {
            view: 'student', // 'student', 'login', 'admin', 'ai_chat', 'schedule_view'
            isAdminLoggedIn: false,
            records: recordsList,
            searchQuery: '',
            filterClass: 'Semua',
            filterDate: new Date().toISOString().split('T')[0],
            chatMessages: chatRecordsList,
            attachedImage: null,
            adminNotes: notesList,
            schedules: scheduleList,
            theme: savedTheme
        };

        function saveRecords() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.records));
        }

        function saveChatMessages() {
            localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(appState.chatMessages));
        }

        function saveNotes() {
            localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify(appState.adminNotes));
        }

        function saveSchedule() {
            localStorage.setItem(SCHEDULE_STORAGE_KEY, JSON.stringify(appState.schedules));
        }

        function setState(newState) {
            appState = { ...appState, ...newState };
            renderApp();
        }

        function formatMarkdown(text) {
            if (!text) return '';
            let cleaned = text.replace(/\*\*/g, '').replace(/\*/g, '');

            let html = cleaned
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            const lines = html.split('\n');
            let formattedLines = lines.map(line => {
                line = line.trim();
                if (/^(\d+\.|\-)\s+/.test(line)) {
                    return `<li class="ml-4 list-disc my-1 text-slate-700 dark:text-slate-300">${line.replace(/^(\d+\.|\-)\s+/, '')}</li>`;
                }
                return line ? `<p class="my-1.5 leading-relaxed text-slate-700 dark:text-slate-300">${line}</p>` : '<div class="h-2"></div>';
            });

            return formattedLines.join('');
        }

        function showModal(type, title, message) {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('modal-content');
            const icon = document.getElementById('modal-icon');
            
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            
            if (type === 'success') {
                icon.className = 'fas fa-check-circle text-6xl text-emerald-500 mb-4 drop-shadow-md';
            } else {
                icon.className = 'fas fa-exclamation-circle text-6xl text-rose-500 mb-4 drop-shadow-md';
            }
            
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            });
        }

        document.getElementById('btn-close-modal').addEventListener('click', () => {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        });

        function openEditModal(recordId) {
            const rec = appState.records.find(r => r.id === recordId);
            if (!rec) return;

            let classOpts = '';
            classes.forEach(c => {
                classOpts += `<option value="${c}" ${rec.kelas === c ? 'selected' : ''}>${c}</option>`;
            });
            document.getElementById('edit-class').innerHTML = classOpts;

            document.getElementById('edit-record-id').value = rec.id;
            document.getElementById('edit-name').value = rec.name;
            document.getElementById('edit-nis').value = rec.nis;
            document.getElementById('edit-date').value = rec.tanggal;
            document.getElementById('edit-status').value = rec.status;

            const modal = document.getElementById('edit-modal');
            const content = document.getElementById('edit-modal-content');
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            });
        }

        function closeEditModal() {
            const modal = document.getElementById('edit-modal');
            const content = document.getElementById('edit-modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        document.getElementById('btn-close-edit').addEventListener('click', closeEditModal);
        document.getElementById('btn-cancel-edit').addEventListener('click', closeEditModal);

        function renderNavbar() {
            const isDark = appState.theme === 'dark';
            return `
                <nav class="bg-white dark:bg-slate-900 shadow-sm border-b border-slate-200 dark:border-slate-800 relative z-20 flex-shrink-0 transition-colors duration-300">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-3 cursor-pointer nav-btn" data-target="student">
                            <div class="w-11 h-11 bg-gradient-to-br from-blue-600 to-indigo-700 text-white rounded-xl flex items-center justify-center text-xl shadow-lg shadow-blue-500/30">
                                <i class="fas fa-school"></i>
                            </div>
                            <div>
                                <h1 class="font-bold text-lg text-slate-800 dark:text-white leading-tight">Presensi TJKT SMKN 2 Baleendah</h1>
                                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Sistem Mandiri Siswa & AI Assistant</p>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-2 bg-slate-100 dark:bg-slate-800 p-1.5 rounded-xl items-center">
                            <button class="nav-btn px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all ${appState.view === 'student' ? 'bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white'}" data-target="student">
                                <i class="fas fa-user-pen mr-1"></i> Absen
                            </button>
                            <button class="nav-btn px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all ${appState.view === 'schedule_view' ? 'bg-white dark:bg-slate-700 text-emerald-600 dark:text-emerald-400 shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white'}" data-target="schedule_view">
                                <i class="fas fa-calendar-alt mr-1"></i> Jadwal
                            </button>
                            <button class="nav-btn px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all ${appState.view === 'ai_chat' ? 'bg-white dark:bg-slate-700 text-purple-600 dark:text-purple-400 shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white'}" data-target="ai_chat">
                                <i class="fas fa-robot mr-1 text-purple-500"></i> Tanya AI
                            </button>
                            ${appState.isAdminLoggedIn ? `
                                <button class="nav-btn px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all ${appState.view === 'admin' ? 'bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white'}" data-target="admin">
                                    <i class="fas fa-chart-pie mr-1"></i> Admin
                                </button>
                                <button class="nav-btn px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/50" data-target="logout">
                                    <i class="fas fa-sign-out-alt mr-1"></i> Keluar
                                </button>
                            ` : `
                                <button class="nav-btn px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all ${appState.view === 'login' ? 'bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white'}" data-target="login">
                                    <i class="fas fa-lock mr-1"></i> Login
                                </button>
                            `}
                            <!-- Tombol Theme Toggle -->
                            <button id="btn-theme-toggle" class="p-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all text-sm ml-1" title="Ganti Tema Light/Night">
                                <i class="fas ${isDark ? 'fa-sun text-amber-400' : 'fa-moon text-slate-700'}"></i>
                            </button>
                        </div>
                    </div>
                </nav>
            `;
        }

        function renderStudentView() {
            let classOptions = '<option value="" disabled selected>-- Pilih Kelas Anda --</option>';
            classes.forEach(c => {
                classOptions += `<option value="${c}">${c}</option>`;
            });

            const todayFormatted = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            let notesHtml = '';
            if (appState.adminNotes && appState.adminNotes.length > 0) {
                appState.adminNotes.slice(0, 2).forEach(n => {
                    notesHtml += `<div class="bg-white/10 backdrop-blur-sm p-3 rounded-xl border border-white/10 text-xs mt-2 flex items-start gap-2"><i class="fas fa-info-circle text-emerald-300 mt-0.5"></i> <span>${n.text}</span></div>`;
                });
            }

            return `
                <div class="max-w-4xl mx-auto py-6 px-4 space-y-6">
                    <!-- Banner & Catatan Piket Guru -->
                    <div class="bg-gradient-to-r from-emerald-600 to-teal-700 rounded-3xl p-6 text-white shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="flex items-start gap-4">
                            <div class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center text-3xl border border-white/20 shrink-0">
                                <i class="fas fa-bullhorn text-emerald-200"></i>
                            </div>
                            <div>
                                <span class="bg-emerald-500/40 text-emerald-100 text-xs font-bold uppercase tracking-widest px-2.5 py-0.5 rounded-full border border-emerald-400/30">Pengumuman Jurusan TJKT</span>
                                <h3 class="text-xl font-extrabold mt-1">Portal Kehadiran Mandiri</h3>
                                <p class="text-emerald-100 text-xs mt-0.5">Lakukan absensi setiap hari sebelum pukul 07.30 WIB. Cek jadwal pelajaran dan gunakan Tanya AI untuk bantuan tugas!</p>
                                ${notesHtml}
                            </div>
                        </div>
                        <div class="bg-white/10 backdrop-blur-md px-4 py-3 rounded-2xl border border-white/20 text-center shrink-0 w-full md:w-auto">
                            <p class="text-[10px] text-emerald-200 uppercase font-bold">Total Absen Hari Ini</p>
                            <p class="text-2xl font-extrabold">${appState.records.filter(r => r.tanggal === new Date().toISOString().split('T')[0]).length} Siswa</p>
                        </div>
                    </div>

                    <!-- Attendance Form -->
                    <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-100 dark:border-slate-800 overflow-hidden transition-colors duration-300">
                        <div class="bg-gradient-to-r from-blue-700 to-indigo-800 p-8 text-white relative">
                            <div class="absolute right-4 top-4 opacity-10">
                                <i class="fas fa-fingerprint text-8xl"></i>
                            </div>
                            <span class="bg-blue-500/40 text-blue-100 text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full border border-blue-400/30">Hadir Tepat Waktu</span>
                            <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight mt-3">Form Kehadiran Mandiri</h2>
                            <p class="text-blue-100 text-sm mt-1">Siswa-siswi TJKT SMKN 2 Baleendah silakan melakukan presensi harian.</p>
                        </div>

                        <div class="p-6 sm:p-8 bg-slate-50/50 dark:bg-slate-800/50 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
                            <div class="flex items-center gap-3 text-slate-600 dark:text-slate-300">
                                <div class="w-10 h-10 rounded-xl bg-blue-50 dark:bg-slate-800 text-blue-600 dark:text-blue-400 flex items-center justify-center font-bold">
                                    <i class="fas fa-calendar-day"></i>

                        <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm transition-colors duration-300">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Masuk Data</p>
                            <p class="text-3xl font-extrabold text-slate-800 dark:text-white mt-1">${totalAbsen}</p>
                        </div>
                        <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm border-l-4 border-l-emerald-500 transition-colors duration-300">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Hadir</p>
                            <p class="text-3xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-1">${totalHadir}</p>
                        </div>
                        <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm border-l-4 border-l-blue-500 transition-colors duration-300">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Izin</p>
                            <p class="text-3xl font-extrabold text-blue-600 dark:text-blue-400 mt-1">${totalIzin}</p>
                        </div>
                        <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm border-l-4 border-l-amber-500 transition-colors duration-300">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Sakit</p>
                            <p class="text-3xl font-extrabold text-amber-600 dark:text-amber-400 mt-1">${totalSakit}</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 transition-colors duration-300 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-slate-800 dark:text-white mb-3 flex items-center gap-2"><i class="fas fa-clipboard-list text-blue-600"></i> Buat Pengumuman untuk Layar Siswa</h3>
                                <form id="note-form" class="space-y-3 mb-4">
                                    <input type="text" id="note-input" placeholder="Tulis pengumuman penting..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-sm bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none" required>
                                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl font-bold text-xs shadow-md transition-all">Posting Info</button>
                                </form>
                            </div>
                            <div class="space-y-2 max-h-32 overflow-y-auto">
                                ${notesHtml || '<p class="text-xs text-slate-400 italic">Belum ada catatan pengumuman aktif.</p>'}
                            </div>
                        </div>

                        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 transition-colors duration-300">
                            <h3 class="font-bold text-slate-800 dark:text-white mb-3 flex items-center gap-2"><i class="fas fa-calendar-plus text-emerald-600"></i> Tambah Jadwal Pelajaran</h3>
                            <form id="schedule-form" class="space-y-3">
                                <div class="grid grid-cols-2 gap-2">
                                    <select id="sch-class" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100" required>
                                        ${scheduleClassOptions}
                                    </select>
                                    <select id="sch-day" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100" required>
                                        <option value="Senin">Senin</option>
                                        <option value="Selasa">Selasa</option>
                                        <option value="Rabu">Rabu</option>
                                        <option value="Kamis">Kamis</option>
                                        <option value="Jumat">Jumat</option>
                                    </select>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="text" id="sch-time" placeholder="Jam (cth: 07.00 - 09.30)" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100" required>
                                    <input type="text" id="sch-subject" placeholder="Mata Pelajaran" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100" required>
                                </div>
                                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl font-bold text-xs shadow-md transition-all">Simpan Jadwal</button>
                            </form>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 flex flex-col sm:flex-row gap-4 items-center justify-between transition-colors duration-300">
                        <div class="flex flex-wrap gap-3 w-full sm:w-auto items-center">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Filter Tanggal</label>
                                <input type="date" id="filter-date" value="${appState.filterDate}" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-medium bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Filter Kelas</label>
                                <select id="filter-class" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-medium bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none">
                                    ${classOptions}
                                </select>
                            </div>
                        </div>
                        <div class="w-full sm:w-72">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Cari Siswa</label>
                            <div class="relative">
                                <i class="fas fa-search absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                                <input type="text" id="search-query" value="${appState.searchQuery}" placeholder="Cari nama atau NIS..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-medium bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 overflow-hidden transition-colors duration-300">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse min-w-[750px]">
                                <thead>
                                    <tr class="bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider border-b border-slate-200 dark:border-slate-700">
                                        <th class="px-4 py-4 text-center font-bold w-16">No</th>
                                        <th class="px-4 py-4 font-bold">NIS</th>
                                        <th class="px-4 py-4 font-bold">Nama Lengkap</th>
                                        <th class="px-4 py-4 font-bold">Kelas</th>
                                        <th class="px-4 py-4 font-bold">Gender</th>
                                        <th class="px-4 py-4 font-bold">Waktu Absen</th>
                                        <th class="px-4 py-4 font-bold">Status</th>
                                        <th class="px-4 py-4 text-center font-bold">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${tableRows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderApp() {
            const root = document.getElementById('root');
            let content = '';
            
            if (appState.view === 'student') content = renderStudentView();
            else if (appState.view === 'schedule_view') content = renderScheduleView();
            else if (appState.view === 'ai_chat') content = renderAiChatView();
            else if (appState.view === 'login') content = renderLoginView();
            else if (appState.view === 'admin') {
                if (!appState.isAdminLoggedIn) {
                    appState.view = 'login';
                    content = renderLoginView();
                } else {
                    content = renderAdminView();
                }
            }

            root.innerHTML = `
                ${renderNavbar()}
                <main class="flex-grow p-4 md:p-8 overflow-y-auto fade-in custom-scrollbar">
                    ${content}
                </main>
            `;

            if (appState.view === 'ai_chat') {
                const chatBox = document.getElementById('chat-messages-box');
                if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        document.addEventListener('click', (e) => {
            const themeBtn = e.target.closest('#btn-theme-toggle');
            if (themeBtn) {
                const newTheme = appState.theme === 'light' ? 'dark' : 'light';
                appState.theme = newTheme;
                localStorage.setItem(THEME_STORAGE_KEY, newTheme);
                if (newTheme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                renderApp();
                return;
            }

            const navBtn = e.target.closest('.nav-btn');
            if (navBtn) {
                const target = navBtn.dataset.target;
                if (target === 'logout') {
                    setState({ isAdminLoggedIn: false, view: 'student' });
                } else {
                    setState({ view: target });
                }
                return;
            }

            if (e.target.closest('#btn-open-apikey-modal')) {
                const modal = document.getElementById('apikey-modal');
                modal.classList.remove('hidden');
                document.getElementById('input-custom-apikey').value = localStorage.getItem(CUSTOM_API_KEY_STORAGE) || '';
                return;
            }

            if (e.target.closest('#btn-close-apikey')) {
                document.getElementById('apikey-modal').classList.add('hidden');
                return;
            }

            if (e.target.closest('#btn-save-apikey')) {
                const keyVal = document.getElementById('input-custom-apikey').value.trim();
                localStorage.setItem(CUSTOM_API_KEY_STORAGE, keyVal);
                document.getElementById('apikey-modal').classList.add('hidden');
                showModal('success', 'Berhasil', 'Gemini API Key berhasil disimpan di browser Anda.');
                return;
            }

            if (e.target.closest('#btn-clear-chat')) {
                if (confirm('Apakah Anda ingin menghapus riwayat obrolan AI?')) {
                    appState.chatMessages = [
                        { role: 'assistant', text: 'Riwayat obrolan telah dibersihkan. Ada yang bisa saya bantu lagi?' }
                    ];
                    saveChatMessages();
                    renderApp();
                }
                return;
            }

            if (e.target.closest('#btn-remove-image')) {
                setState({ attachedImage: null });
                return;
            }

            if (e.target.closest('#btn-export-excel')) {
                if (appState.records.length === 0) {
                    showModal('error', 'Kosong', 'Tidak ada data untuk diexport.');
                    return;
                }
                let csv = "No,NIS,Nama Lengkap,Kelas,Gender,Tanggal,Waktu,Status\n";
                appState.records.forEach((r, idx) => {
                    csv += `${idx + 1},${r.nis},"${r.name}",${r.kelas},${r.gender || '-'},${r.tanggal},${r.waktu},${r.status}\n`;
                });

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `Rekap_Absensi_TJKT_SMKN2Baleendah_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showModal('success', 'Berhasil', 'Dokumen Excel (CSV) berhasil diunduh.');
            }
        });

        document.addEventListener('change', (e) => {
            if (e.target.id === 'chat-image-input') {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(uploadEvent) {
                        setState({ attachedImage: uploadEvent.target.result });
                    };
                    reader.readAsDataURL(file);
                }
            }
            if (e.target.id === 'filter-class') {
                appState.filterClass = e.target.value;
                renderApp();
            }
            if (e.target.id === 'filter-date') {
                appState.filterDate = e.target.value;
                renderApp();
            }
        });

        async function fetchWithRetry(url, options, retries = 5, delay = 2500) {
            try {
                const response = await fetch(url, options);
                if (response.status === 429 && retries > 0) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchWithRetry(url, options, retries - 1, delay * 2);
                }
                return response;
            } catch (error) {
                if (retries > 0) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchWithRetry(url, options, retries - 1, delay * 2);
                }
                throw error;
            }
        }

        document.addEventListener('submit', async (e) => {
            if (e.target.id === 'student-attendance-form') {
                e.preventDefault();
                const name = document.getElementById('student-name').value.trim();
                const nis = document.getElementById('student-nis').value.trim();
                const kelas = document.getElementById('student-class').value;
                const genderRadio = document.querySelector('input[name="student-gender"]:checked');
                const gender = genderRadio ? genderRadio.value : 'Laki-laki';
                const statusRadio = document.querySelector('input[name="student-status"]:checked');
                const status = statusRadio ? statusRadio.value : 'Hadir';

                const now = new Date();
                const tanggal = now.toISOString().split('T')[0];
                const waktu = now.toTimeString().split(' ')[0];

                const newRecord = {
                    id: 'REC_' + Date.now(),
                    name,
                    nis,
                    kelas,
                    gender,
                    tanggal,
                    waktu,
                    status
                };

                appState.records.unshift(newRecord);
                saveRecords();

                showModal('success', 'Absensi Berhasil!', `Terima kasih ${name} (${kelas}), kehadiran Anda berhasil dicatat sistem pada pukul ${waktu}.`);
                document.getElementById('student-attendance-form').reset();
                renderApp();
                return;
            }

            if (e.target.id === 'note-form') {
                e.preventDefault();
                const text = document.getElementById('note-input').value.trim();
                if (!text) return;
                appState.adminNotes.unshift({
                    id: 'NOTE_' + Date.now(),
                    date: new Date().toLocaleDateString('id-ID'),
                    text
                });
                saveNotes();
                renderApp();
                return;
            }

            if (e.target.id === 'schedule-form') {
                e.preventDefault();
                const kelas = document.getElementById('sch-class').value;
                const hari = document.getElementById('sch-day').value;
                const jam = document.getElementById('sch-time').value.trim();
                const mapel = document.getElementById('sch-subject').value.trim();

                appState.schedules.unshift({
                    id: 'SCH_' + Date.now(),
                    kelas,
                    hari,
                    jam,
                    mapel
                });
                saveSchedule();
                renderApp();
                showModal('success', 'Berhasil', 'Jadwal pelajaran baru berhasil ditambahkan.');
                return;
            }

            if (e.target.id === 'chat-form') {
                e.preventDefault();
                const inputEl = document.getElementById('chat-input');
                const userMsg = inputEl.value.trim();
                const currentImg = appState.attachedImage;

                if (!userMsg && !currentImg) return;

                const displayPrompt = userMsg || "Tolong bantu jelaskan dan selesaikan soal matematika / tugas pada gambar ini.";

                appState.chatMessages.push({ role: 'user', text: displayPrompt, image: currentImg });
                appState.attachedImage = null;
                inputEl.value = '';
                saveChatMessages();
                renderApp();

                appState.chatMessages.push({ role: 'assistant', text: '<i class="fas fa-spinner fa-spin mr-2"></i> Sedang berpikir...', isLoading: true });
                renderApp();

                const customKey = localStorage.getItem(CUSTOM_API_KEY_STORAGE);
                if (!customKey) {
                    appState.chatMessages.pop();
                    appState.chatMessages.push({ role: 'assistant', text: 'Gemini API Key belum diatur! Silakan klik tombol <b class="text-purple-600">"Atur API Key"</b> di pojok kanan atas area chat terlebih dahulu untuk menggunakan fitur AI.', isLoading: false });
                    saveChatMessages();
                    renderApp();
                    return;
                }

                try {
                    const systemPrompt = `Anda adalah Asisten AI yang ramah dan sangat ahli dalam matematika serta teknologi komputer untuk siswa siswi jurusan TJKT SMKN 2 Baleendah. ATURAN KETAT: Jawablah HANYA pertanyaan atau tugas yang diajukan oleh pengguna dengan ringkas, jelas, rapi, dan terstruktur. Jangan pernah berinisiatif menyebutkan atau memberikan rekap data absensi sekolah kecuali pengguna secara eksplisit meminta data absensi.`;
                    
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${customKey}`;
                    
                    let parts = [{ text: displayPrompt }];

                    if (currentImg) {
                        const base64Data = currentImg.split(',')[1];
                        parts.push({
                            inlineData: {
                                mimeType: "image/jpeg",
                                data: base64Data
                            }
                        });
                    }

                    const payload = {
                        contents: [{ parts: parts }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    };

                    const response = await fetchWithRetry(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    const candidate = result.candidates?.[0];
                    let botReply = "Mohon maaf, server AI sedang sibuk karena terlalu banyak permintaan. Silakan tunggu beberapa saat lalu coba kirim pesan kembali.";
                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        botReply = candidate.content.parts[0].text;
                    }

                    appState.chatMessages.pop();
                    appState.chatMessages.push({ role: 'assistant', text: botReply, isLoading: false });
                    saveChatMessages();
                    renderApp();
                } catch (err) {
                    appState.chatMessages.pop();
                    appState.chatMessages.push({ role: 'assistant', text: "Mohon maaf, koneksi ke server AI sedang sibuk (Error 429). Silakan tunggu sekitar 1-2 menit lalu coba kirim pesan lagi ya.", isLoading: false });
                    saveChatMessages();
                    renderApp();
                }
                return;
            }

            if (e.target.id === 'login-form') {
                e.preventDefault();
                const user = document.getElementById('username').value;
                const pass = document.getElementById('password').value;

                if (user === 'admin' && pass === 'admin123') {
                    setState({ isAdminLoggedIn: true, view: 'admin' });
                } else {
                    showModal('error', 'Login Gagal', 'Username atau password admin salah.');
                }
                return;
            }

            if (e.target.id === 'edit-form') {
                e.preventDefault();
                const id = document.getElementById('edit-record-id').value;
                const name = document.getElementById('edit-name').value;
                const nis = document.getElementById('edit-nis').value;
                const kelas = document.getElementById('edit-class').value;
                const tanggal = document.getElementById('edit-date').value;
                const status = document.getElementById('edit-status').value;

                appState.records = appState.records.map(r => {
                    if (r.id === id) {
                        return { ...r, name, nis, kelas, tanggal, status };
                    }
                    return r;
                });
                saveRecords();

                closeEditModal();
                showModal('success', 'Berhasil', 'Data absensi siswa berhasil diperbarui.');
                renderApp();
                return;
            }
        });

        document.addEventListener('input', (e) => {
            if (e.target.id === 'search-query') {
                appState.searchQuery = e.target.value;
                renderApp();
                setTimeout(() => {
                    const input = document.getElementById('search-query');
                    if(input) { input.focus(); input.selectionStart = input.value.length; }
                }, 50);
            }
        });

        window.deleteRecord = (id) => {
            if (confirm('Apakah Anda yakin ingin menghapus data absensi siswa ini?')) {
                appState.records = appState.records.filter(r => r.id !== id);
                saveRecords();
                renderApp();
                showModal('success', 'Terhapus', 'Data absensi berhasil dihapus dari sistem.');
            }
        };

        window.deleteNote = (id) => {
            appState.adminNotes = appState.adminNotes.filter(n => n.id !== id);
            saveNotes();
            renderApp();
        };

        window.deleteSchedule = (id) => {
            appState.schedules = appState.schedules.filter(s => s.id !== id);
            saveSchedule();
            renderApp();
        };

        window.openEditModal = openEditModal;

        renderApp();
    </script>
</body>
</html>
